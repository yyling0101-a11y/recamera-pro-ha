name: Publish reCamera Pro Installer App

on:
  push:
    branches:
      - main
    paths:
      - "recamera-pro-installer/**"
      - ".github/workflows/app-publish.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app
        run: |
          version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' recamera-pro-installer/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish app image
        uses: docker/build-push-action@v6
        with:
          context: ./recamera-pro-installer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yyling0101-a11y/recamera-pro-installer:${{ steps.app.outputs.version }}
